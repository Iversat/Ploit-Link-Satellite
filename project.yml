name: PloitSatellite
options:
  bundleIdPrefix: ru.ploit
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.3"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PloitSatellite:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Ploit Space
        CFBundleShortVersionString: "1.3.5"
        CFBundleVersion: "9"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSLocationWhenInUseUsageDescription: Ваше положение нужно для расчёта направления на спутник и времени пролёта. Координаты остаются на устройстве.
        NSMotionUsageDescription: Датчики движения нужны, чтобы навести верхний торец телефона или внешнюю антенну на спутник.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.ploit.satellite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  PloitSatelliteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PloitSatellite
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PloitSatelliteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PloitSatellite
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PloitSatellite:
    build:
      targets:
        PloitSatellite: all
    test:
      targets: [PloitSatelliteTests, PloitSatelliteUITests]
