name: PloitSatellite
options:
  bundleIdPrefix: ru.ploit
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.3"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PloitSatellite:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes: [SkyScene.mlpackage]
        buildPhase: resources
      - path: Resources/SkyScene.mlpackage
        buildPhase: sources
      - path: LICENSES/SkyScene-NOTICE.md
        buildPhase: resources
      - path: LICENSES/MMSegmentation-Apache-2.0.txt
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: PLS
        CFBundleShortVersionString: "1.7.1"
        CFBundleVersion: "19"
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSLocationWhenInUseUsageDescription: Ваше положение нужно для расчёта направления на спутник и времени пролёта. Для автоматического обновления погоды округлённые координаты передаются Open-Meteo при открытии приложения.
        NSMotionUsageDescription: Датчики движения нужны, чтобы навести верхний торец телефона или внешнюю антенну на спутник.
        NSCameraUsageDescription: Камера и LiDAR нужны для карты препятствий на пути спутника. Кадры обрабатываются на устройстве и не отправляются.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.ploit.satellite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  PloitSatelliteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PloitSatellite
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PloitSatelliteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PloitSatellite
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PloitSatellite:
    build:
      targets:
        PloitSatellite: all
    test:
      targets: [PloitSatelliteTests, PloitSatelliteUITests]
