name: Build unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: SGP4 and prediction tests
        run: |
          node tools/test-orbit.cjs
          python3 tools/test_ipa.py -v
      - name: Build iPhone application
        run: |
          set -o pipefail
          xcodebuild -project PloitSatellite.xcodeproj -scheme PloitSatellite -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build | tee build-device.log
      - name: Package unsigned IPA
        id: package
        run: |
          python3 tools/package-ipa.py build/device/Build/Products/Release-iphoneos/PloitSatellite.app build/Ploit-Satellite-unsigned.ipa
          python3 tools/verify-ipa.py build/Ploit-Satellite-unsigned.ipa
          shasum -a 256 build/Ploit-Satellite-unsigned.ipa > build/SHA256.txt
      - name: Native tests and screenshots
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);v=[x for k,a in sorted(d["devices"].items(),reverse=True) if "iOS-26-" in k for x in a if "iPhone" in x["name"]];print(next((x["udid"] for x in v if x["name"]=="iPhone 16 Pro Max"),v[0]["udid"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project PloitSatellite.xcodeproj -scheme PloitSatellite -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build-for-testing | tee build-simulator.log
          xcrun simctl install "$DEVICE" build/simulator/Build/Products/Debug-iphonesimulator/PloitSatellite.app
          mkdir -p build/screenshots build/diagnostics
          xcrun simctl launch --console "$DEVICE" ru.ploit.satellite --ui-screenshot-orbits-day > build/diagnostics/preflight.log 2>&1 &
          PREFLIGHT_PID=$!
          sleep 15
          xcrun simctl io "$DEVICE" screenshot build/screenshots/preflight.png || true
          cat build/diagnostics/preflight.log
          for APP_PID in $(pgrep -x PloitSatellite || true); do
            sample "$APP_PID" 1 1 -file "build/diagnostics/preflight-$APP_PID.txt" || true
            head -80 "build/diagnostics/preflight-$APP_PID.txt" || true
          done
          xcrun simctl terminate "$DEVICE" ru.ploit.satellite || true
          kill "$PREFLIGHT_PID" 2>/dev/null || true
          wait "$PREFLIGHT_PID" || true
          (
            while sleep 60; do
              date -u
              pgrep -fl 'PloitSatellite|testmanagerd' || true
              for APP_PID in $(pgrep -x PloitSatellite || true); do
                sample "$APP_PID" 1 1 -file "build/diagnostics/test-$APP_PID.txt" || true
              done
            done
          ) &
          MONITOR_PID=$!
          trap 'kill "$MONITOR_PID" 2>/dev/null || true' EXIT
          xcodebuild -project PloitSatellite.xcodeproj -scheme PloitSatellite -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO -resultBundlePath build/Tests.xcresult test-without-building | tee build-tests.log
          kill "$MONITOR_PID" || true
          xcrun simctl install "$DEVICE" build/simulator/Build/Products/Debug-iphonesimulator/PloitSatellite.app
          xcrun simctl terminate "$DEVICE" ru.ploit.satellite || true
          xcrun simctl privacy "$DEVICE" grant location ru.ploit.satellite
          mkdir -p build/screenshots
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          DATA=$(xcrun simctl get_app_container "$DEVICE" ru.ploit.satellite data)
          for SCENE in home home-evening home-day site-scan settings earth-unavailable radar-unavailable earth-skycheck catalogue orbits orbits-forecast orbits-zoomed orbits-day orbits-night radar-top-seeking radar-top-aligned radar-back-seeking radar-back-aligned earth-back-aligned intro-top intro-back; do
            xcrun simctl terminate "$DEVICE" ru.ploit.satellite || true
            rm -f "$DATA/Library/Caches/earth-textures-ready"
            xcrun simctl launch "$DEVICE" ru.ploit.satellite "--ui-screenshot-$SCENE"
            case "$SCENE" in home*|earth-*|orbits*)
              for ATTEMPT in {1..60}; do
                [ -f "$DATA/Library/Caches/earth-textures-ready" ] && break
                sleep 1
              done
              test -f "$DATA/Library/Caches/earth-textures-ready"
              ;;
            esac
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "build/screenshots/$SCENE.png"
          done
          xcrun simctl terminate "$DEVICE" ru.ploit.satellite || true
          xcrun simctl launch "$DEVICE" ru.ploit.satellite --ui-screenshot-orbits-playback
          sleep 5
          xcrun simctl io "$DEVICE" recordVideo --codec=h264 build/screenshots/playback-300.mp4 &
          RECORD_PID=$!
          for FRAME in 0 1 2 3 4 5; do
            xcrun simctl io "$DEVICE" screenshot "build/screenshots/playback-$FRAME.png"
            sleep 2
          done
          kill -INT "$RECORD_PID"
          wait "$RECORD_PID" || true
          xcrun simctl shutdown "$DEVICE"
      - name: Compatibility and compact screenshots
        run: |
          set -euo pipefail
          for KIND in compatibility compact; do
            DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);kind=sys.argv[1];v=[x for k,a in sorted(d["devices"].items(),reverse=True) if ("iOS-18-" if kind=="compatibility" else "iOS-26-") in k for x in a if x["name"]==("iPhone 16 Pro Max" if kind=="compatibility" else "iPhone SE (3rd generation)")];print(v[0]["udid"])' "$KIND")
            xcrun simctl boot "$DEVICE"
            xcrun simctl bootstatus "$DEVICE" -b
            xcrun simctl install "$DEVICE" build/simulator/Build/Products/Debug-iphonesimulator/PloitSatellite.app
            xcrun simctl privacy "$DEVICE" grant location ru.ploit.satellite
            xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
            DATA=$(xcrun simctl get_app_container "$DEVICE" ru.ploit.satellite data)
            rm -f "$DATA/Library/Caches/earth-textures-ready"
            xcrun simctl launch "$DEVICE" ru.ploit.satellite --ui-screenshot-earth-back-aligned
            for ATTEMPT in {1..60}; do
              [ -f "$DATA/Library/Caches/earth-textures-ready" ] && break
              sleep 1
            done
            test -f "$DATA/Library/Caches/earth-textures-ready"
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "build/screenshots/$KIND-earth.png"
            xcrun simctl terminate "$DEVICE" ru.ploit.satellite || true
            rm -f "$DATA/Library/Caches/earth-textures-ready"
            xcrun simctl launch "$DEVICE" ru.ploit.satellite --ui-screenshot-orbits-zoomed
            for ATTEMPT in {1..60}; do
              [ -f "$DATA/Library/Caches/earth-textures-ready" ] && break
              sleep 1
            done
            test -f "$DATA/Library/Caches/earth-textures-ready"
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "build/screenshots/$KIND-orbits-zoomed.png"
            xcrun simctl terminate "$DEVICE" ru.ploit.satellite || true
            xcrun simctl launch "$DEVICE" ru.ploit.satellite --ui-screenshot-home
            sleep 5
            xcrun simctl io "$DEVICE" screenshot "build/screenshots/$KIND-home.png"
            xcrun simctl terminate "$DEVICE" ru.ploit.satellite || true
            xcrun simctl launch "$DEVICE" ru.ploit.satellite --ui-screenshot-site-scan
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "build/screenshots/$KIND-site-scan.png"
            xcrun simctl shutdown "$DEVICE"
          done
      - name: Export test diagnostics
        if: failure()
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/test-attachments
          fi
      - name: Upload IPA
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Ploit-Satellite-unsigned-IPA
          path: |
            build/Ploit-Satellite-unsigned.ipa
            build/SHA256.txt
          retention-days: 30
      - name: Upload native QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Native-QA
          path: |
            build/screenshots
            build/Tests.xcresult
            build/test-attachments
            build-device.log
            build-tests.log
            build-simulator.log
            build/diagnostics
          if-no-files-found: warn
          retention-days: 14
