name: Export on-device sky model
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Conversion tools
        run: |
          set -euo pipefail
          python3 -m venv build-model-env
          build-model-env/bin/python -m pip install --disable-pip-version-check 'torch==2.7.0' 'coremltools==8.3.0' 'numpy<2.0' pillow
      - name: Export licensed ADE20K model
        run: |
          set -euo pipefail
          build-model-env/bin/python tools/export-sky-model.py --output Resources/SkyScene.mlpackage --work-dir build/sky-model
      - name: Model artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SkyScene-CoreML
          path: |
            Resources/SkyScene.mlpackage
            build/sky-model/*.json
          if-no-files-found: error
          retention-days: 30
