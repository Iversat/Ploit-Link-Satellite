name: Site screens QA and unsigned IPA
on:
  workflow_dispatch:
    inputs:
      capture_screenshots:
        description: Capture visual gallery before tests
        type: boolean
        default: true
      record_interactions:
        description: Record simulator interaction video for diagnosis
        type: boolean
        default: false
      extended_devices:
        description: Capture additional iOS 18 and compact iPhone screens
        type: boolean
        default: true
      test_scope:
        description: Native test scope
        type: choice
        options: [all, sky-survey, sky-analysis, none]
        default: all
permissions:
  contents: read
concurrency:
  group: site-qa-${{ github.ref }}-${{ inputs.capture_screenshots != false }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Tools
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          uname -m
          command -v xcodegen || brew install xcodegen
          python3 tools/fetch-sky-fixtures.py
          xcodegen generate
          mkdir -p build/screenshots
          xcrun simctl list devices available -j > build/available-simulators.json
      - name: Build iPhone application
        run: |
          set -euo pipefail
          xcodebuild -project PloitSatellite.xcodeproj -scheme PloitSatellite -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build | tee build-device.log
      - name: Validate full 16K sky on the host Apple GPU
        run: |
          set -euo pipefail
          mkdir -p build/TextureCheck.app/Contents/MacOS build/TextureCheck.app/Contents/Resources
          cp Resources/night-sky-*.astc build/TextureCheck.app/Contents/Resources/
          python3 -c 'import plistlib;plistlib.dump({"CFBundleIdentifier":"ru.ploit.texturecheck","CFBundleExecutable":"TextureCheck","CFBundlePackageType":"APPL"},open("build/TextureCheck.app/Contents/Info.plist","wb"))'
          xcrun swiftc Sources/NightSkyTexture.swift tools/validate-night-texture.swift -framework MetalKit -o build/TextureCheck.app/Contents/MacOS/TextureCheck
          MTL_DEBUG_LAYER=1 build/TextureCheck.app/Contents/MacOS/TextureCheck | tee build/night-texture-check.log
      - name: Package and verify unsigned IPA
        id: package
        run: |
          set -euo pipefail
          python3 tools/package-ipa.py build/device/Build/Products/Release-iphoneos/PloitSatellite.app build/Ploit-Satellite-unsigned.ipa
          python3 tools/verify-ipa.py build/Ploit-Satellite-unsigned.ipa
          shasum -a 256 build/Ploit-Satellite-unsigned.ipa > build/SHA256.txt
      - name: Upload IPA
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Ploit-Satellite-unsigned-IPA
          path: |
            build/Ploit-Satellite-unsigned.ipa
            build/SHA256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Prepare iOS 26 Pro Max simulator
        run: |
          set -euo pipefail
          DEVICE=$(python3 -c 'import json;d=json.load(open("build/available-simulators.json"));v=[x for k,a in sorted(d["devices"].items(),reverse=True) if "iOS-26-" in k for x in a if x["name"].endswith("Pro Max")];assert v,"No available iOS 26 Pro Max simulator";print(next((x["udid"] for x in v if x["name"]=="iPhone 16 Pro Max"),v[0]["udid"]))')
          echo "SITE_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          echo "$DEVICE" >> build/site-devices.txt
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Build simulator application and tests
        id: simulator-build
        run: |
          set -euo pipefail
          xcodebuild -project PloitSatellite.xcodeproj -scheme PloitSatellite -configuration Debug -destination "platform=iOS Simulator,id=$SITE_DEVICE" -parallel-testing-enabled NO -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build-for-testing | tee build-simulator.log
      - name: Capture site and home screens
        timeout-minutes: 12
        id: visuals
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' && inputs.capture_screenshots != false }}
        env:
          EXTENDED_DEVICES: ${{ inputs.extended_devices }}
          TEST_SCOPE: ${{ inputs.test_scope }}
        run: |
          set -euo pipefail
          KINDS="ios26-pro-max"
          if [ "$EXTENDED_DEVICES" = true ]; then KINDS="$KINDS ios18-pro-max ios26-se"; fi
          for KIND in $KINDS; do
            if [ "$KIND" = ios26-pro-max ]; then
              DEVICE="$SITE_DEVICE"
              SCENES="home-night home-day home-evening orbits-night site-intro site-scan site-capture site-info site-gyro radar-back-intro radar-top-intro radar-top-aligned"
              if [ "$TEST_SCOPE" = sky-survey ]; then
                SCENES="home-night site-capture site-capture-room site-face night-sky night-sky-detail night-sky-gyro night-sky-below demo-chat demo-chat-back"
              fi
            else
              DEVICE=$(python3 -c 'import json,sys;d=json.load(open("build/available-simulators.json"));kind=sys.argv[1];runtime="iOS-18-" if kind=="ios18-pro-max" else "iOS-26-";name="iPhone 16 Pro Max" if kind=="ios18-pro-max" else "iPhone SE (3rd generation)";v=[x for k,a in sorted(d["devices"].items(),reverse=True) if runtime in k for x in a if x["name"]==name];assert v,"Required simulator unavailable: "+kind;print(v[0]["udid"])' "$KIND")
              echo "$DEVICE" >> build/site-devices.txt
              SCENES="home-night site-intro site-scan site-capture site-info radar-back-intro"
            fi
            xcrun simctl boot "$DEVICE" || true
            xcrun simctl bootstatus "$DEVICE" -b
            xcrun simctl install "$DEVICE" build/simulator/Build/Products/Debug-iphonesimulator/PloitSatellite.app
            xcrun simctl privacy "$DEVICE" grant location ru.ploit.satellite
            xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
            DATA=$(xcrun simctl get_app_container "$DEVICE" ru.ploit.satellite data)
            for SCENE in $SCENES; do
              xcrun simctl terminate "$DEVICE" ru.ploit.satellite || true
              rm -f "$DATA/Library/Caches/earth-textures-ready"
              rm -f "$DATA/Library/Caches/night-panorama-ready"
              xcrun simctl launch "$DEVICE" ru.ploit.satellite "--ui-screenshot-$SCENE"
              case "$SCENE" in home*|orbits-*|earth-*)
                for ATTEMPT in {1..60}; do
                  [ -f "$DATA/Library/Caches/earth-textures-ready" ] && break
                  sleep 1
                done
                test -f "$DATA/Library/Caches/earth-textures-ready"
                ;;
                night-sky*)
                  for ATTEMPT in {1..45}; do
                    [ -f "$DATA/Library/Caches/night-panorama-ready" ] && break
                    sleep 1
                  done
                  if [ ! -f "$DATA/Library/Caches/night-panorama-ready" ]; then
                    python3 -c 'import subprocess,sys;subprocess.run(["xcrun","simctl","io",sys.argv[1],"screenshot",sys.argv[2]],timeout=15)' "$DEVICE" "build/screenshots/$KIND-$SCENE-failed.png" || true
                    xcrun simctl spawn "$DEVICE" log show --last 2m --style compact --predicate 'process == "PloitSatellite"' > build/night-sky-errors.log || true
                    mkdir -p build/crashes
                    cp "$HOME"/Library/Logs/DiagnosticReports/PloitSatellite* build/crashes/ 2>/dev/null || true
                    exit 1
                  fi
                  ;;
              esac
              sleep 3
              xcrun simctl io "$DEVICE" screenshot "build/screenshots/$KIND-$SCENE.png"
            done
            xcrun simctl terminate "$DEVICE" ru.ploit.satellite || true
            if [ "$DEVICE" != "$SITE_DEVICE" ] || [ "$EXTENDED_DEVICES" = true ]; then
              xcrun simctl shutdown "$DEVICE"
            fi
          done
      - name: Upload visual gallery
        if: ${{ !cancelled() && steps.visuals.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Visual-QA
          path: build/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Unit tests and application UI tests
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' && inputs.test_scope != 'none' }}
        env:
          RECORD_INTERACTIONS: ${{ inputs.record_interactions }}
          TEST_SCOPE: ${{ inputs.test_scope }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$SITE_DEVICE" || true
          xcrun simctl bootstatus "$SITE_DEVICE" -b
          if [ "$RECORD_INTERACTIONS" = true ]; then
            xcrun simctl io "$SITE_DEVICE" recordVideo --codec=h264 build/screenshots/site-interactions.mp4 &
            RECORDING_PID=$!
            trap 'kill -INT "$RECORDING_PID" 2>/dev/null || true; wait "$RECORDING_PID" || true' EXIT
          fi
          TESTS=(-only-testing:PloitSatelliteTests -only-testing:PloitSatelliteUITests)
          if [ "$TEST_SCOPE" = sky-survey ]; then
            TESTS=(
              -only-testing:PloitSatelliteTests/SkySurveyTests
              -only-testing:PloitSatelliteTests/SkyScanGeometryTests
              -only-testing:PloitSatelliteTests/SkyScanLifecycleTests
              -only-testing:PloitSatelliteTests/ScanHardwareTests
              -only-testing:PloitSatelliteTests/NightSkyTests
              -only-testing:PloitSatelliteUITests/NightSkyFlowTests
              -only-testing:PloitSatelliteTests/SkyDomeProjectionTests
              -only-testing:PloitSatelliteTests/SkySceneClassifierTests
              -only-testing:PloitSatelliteTests/SkySceneFusionTests
              -only-testing:PloitSatelliteUITests/SiteScanFlowTests/testSkyModesPathAndNeutralInformationReturnToMap
              -only-testing:PloitSatelliteUITests/SiteScanFlowTests/testCameraPreviewFinishesInspectsAndReturnsToTheSameMap
              -only-testing:PloitSatelliteUITests/SiteScanFlowTests/testRoomScanShowsDotsAndPercentageBelowHorizon
              -only-testing:PloitSatelliteUITests/SiteScanFlowTests/testRearPhoneInstructionsShowAndDismiss
              -only-testing:PloitSatelliteUITests/SiteScanFlowTests/testSkyDomeRotatesInBothDirectionsResetsAndReturnsHome
              -only-testing:PloitSatelliteUITests/SiteScanFlowTests/testAutoToggleAndDateLabelExist
              -only-testing:PloitSatelliteUITests/PointingFlowTests/testUnavailableEarthAndRadarShowSamePassAndNoConnection
            )
          fi
          if [ "$TEST_SCOPE" = sky-analysis ]; then
            TESTS=(
              -only-testing:PloitSatelliteTests/SkySurveyTests
              -only-testing:PloitSatelliteTests/SkySceneClassifierTests
              -only-testing:PloitSatelliteTests/SkySceneFusionTests
            )
          fi
          xcodebuild -project PloitSatellite.xcodeproj -scheme PloitSatellite -configuration Debug -destination "platform=iOS Simulator,id=$SITE_DEVICE" -parallel-testing-enabled NO "${TESTS[@]}" -test-timeouts-enabled YES -default-test-execution-time-allowance 90 -maximum-test-execution-time-allowance 120 -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO -resultBundlePath build/SiteTests.xcresult test-without-building | tee build-site-tests.log | awk '/Test (Suite|Case)|Executed [0-9]+ tests|error:|failed|TEST (SUCCEEDED|FAILED)/ { print; fflush() }'
      - name: Export test attachments including weather controls
        if: always()
        run: |
          if [ -d build/SiteTests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/SiteTests.xcresult --output-path build/test-attachments
          fi
      - name: Upload site QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Site-QA
          path: |
            build/screenshots
            build/SiteTests.xcresult
            build/test-attachments
            build/available-simulators.json
            build-device.log
            build-simulator.log
            build-site-tests.log
            build/night-sky-errors.log
            build/night-texture-check.log
            build/crashes
          if-no-files-found: warn
          retention-days: 14
      - name: Stop simulators
        if: always()
        run: |
          if [ -f build/site-devices.txt ]; then
            while IFS= read -r DEVICE; do
              xcrun simctl shutdown "$DEVICE" || true
            done < build/site-devices.txt
          fi
