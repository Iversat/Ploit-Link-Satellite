name: Earth visual QA and unsigned IPA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: earth-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          command -v xcodegen || brew install xcodegen
          xcodegen generate
          python3 -m venv build/visual-venv
          build/visual-venv/bin/pip install --disable-pip-version-check Pillow==12.0.0
      - name: Orbital calculations
        run: node tools/test-orbit.cjs
      - name: Build iPhone application
        run: |
          set -o pipefail
          xcodebuild -project PloitSatellite.xcodeproj -scheme PloitSatellite -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build | tee build-device.log
      - name: Package unsigned IPA
        id: package
        run: |
          python3 tools/package-ipa.py build/device/Build/Products/Release-iphoneos/PloitSatellite.app build/Ploit-Satellite-unsigned.ipa
          python3 tools/verify-ipa.py build/Ploit-Satellite-unsigned.ipa
          shasum -a 256 build/Ploit-Satellite-unsigned.ipa > build/SHA256.txt
      - name: Render native Earth screenshots
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);v=[x for k,a in sorted(d["devices"].items(),reverse=True) if "iOS-26-" in k for x in a if "iPhone" in x["name"]];print(next((x["udid"] for x in v if x["name"]=="iPhone 16 Pro Max"),v[0]["udid"]))')
          echo "EARTH_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcodebuild -project PloitSatellite.xcodeproj -scheme PloitSatellite -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build | tee build-simulator.log
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/simulator/Build/Products/Debug-iphonesimulator/PloitSatellite.app
          xcrun simctl privacy "$DEVICE" grant location ru.ploit.satellite
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          DATA=$(xcrun simctl get_app_container "$DEVICE" ru.ploit.satellite data)
          mkdir -p build/screenshots
          for SCENE in home-night home-evening home-day site-scan radar-top-aligned orbits-day orbits-night orbits-zoomed; do
            xcrun simctl terminate "$DEVICE" ru.ploit.satellite || true
            rm -f "$DATA/Library/Caches/earth-textures-ready"
            xcrun simctl launch "$DEVICE" ru.ploit.satellite "--ui-screenshot-$SCENE"
            case "$SCENE" in home-*|orbits-*)
              for ATTEMPT in {1..60}; do
                [ -f "$DATA/Library/Caches/earth-textures-ready" ] && break
                sleep 1
              done
              test -f "$DATA/Library/Caches/earth-textures-ready"
              ;;
            esac
            sleep 3
            FILE="$SCENE"
            if [ "$SCENE" = home-night ]; then FILE=home; fi
            xcrun simctl io "$DEVICE" screenshot "build/screenshots/$FILE.png"
          done
      - name: Check night colors and city lights
        run: build/visual-venv/bin/python tools/check-earth-colors.py build/screenshots --output build/earth-colors.json
      - name: Upload IPA
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Ploit-Satellite-unsigned-IPA
          path: |
            build/Ploit-Satellite-unsigned.ipa
            build/SHA256.txt
      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Earth-Visual-QA
          path: |
            build/screenshots
            build/earth-colors.json
            build-device.log
            build-simulator.log
      - name: Stop simulator
        if: always()
        run: |
          if [ -n "${EARTH_DEVICE:-}" ]; then xcrun simctl shutdown "$EARTH_DEVICE" || true; fi
