name: Prepare NASA night sky assets
on: workflow_dispatch
permissions:
  contents: read
jobs:
  panorama:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download catalog panorama and encoder
        run: |
          set -euo pipefail
          python3 -m pip install numpy==2.3.5 Pillow==12.0.0 OpenEXR==3.5.2
          curl -fL --retry 3 --connect-timeout 30 https://svs.gsfc.nasa.gov/vis/a000000/a004800/a004851/milkyway_2020_16k_gal.exr -o /tmp/milkyway.exr
          curl -fL --retry 3 https://github.com/ARM-software/astc-encoder/releases/download/5.7.0/astcenc-5.7.0-linux-x64.zip -o /tmp/encoder.zip
          unzip /tmp/encoder.zip -d /tmp/encoder
          chmod +x /tmp/encoder/bin/astcenc-avx2
      - name: Encode native 16K map and all mip levels
        run: python3 tools/prepare-night-panorama.py /tmp/milkyway.exr /tmp/encoder/bin/astcenc-avx2 build/night-sky
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NASA-night-sky-16K
          path: build/night-sky
          retention-days: 30
