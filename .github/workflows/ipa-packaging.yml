name: IPA packaging compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Packaging regression tests
        run: python3 tools/test_ipa.py -v
      - name: Verify published device archive and compatibility package
        run: |
          set -euo pipefail
          mkdir -p build/ipa-check
          cd build/ipa-check
          curl --fail --location --retry 3 -o original.ipa https://github.com/Iversat/Ploit-Satellite-iOS/releases/download/v1.3.8/Ploit-Space-1.3.8-unsigned.ipa
          curl --fail --location --retry 3 -o compat.ipa https://github.com/Iversat/Ploit-Satellite-iOS/releases/download/v1.3.8/Ploit-Space-1.3.8-compat-unsigned.ipa
          unzip -q original.ipa -d original
          unzip -q compat.ipa -d compat
          plutil -lint original/Payload/PloitSatellite.app/Info.plist
          plutil -lint compat/Payload/PloitSatellite.app/Info.plist
          swift - original/Payload/PloitSatellite.app/Info.plist compat/Payload/PloitSatellite.app/Info.plist <<'SWIFT'
          import Foundation
          let dictionaries = try CommandLine.arguments.dropFirst().map { path in
              try PropertyListSerialization.propertyList(from: Data(contentsOf: URL(fileURLWithPath: path)), options: [], format: nil) as! NSDictionary
          }
          precondition(dictionaries.count == 2 && dictionaries[0].isEqual(dictionaries[1]))
          print("Foundation parses both Info.plist files with identical values")
          SWIFT
          cd ../..
          python3 tools/verify-ipa.py build/ipa-check/original.ipa
          python3 tools/verify-ipa.py build/ipa-check/compat.ipa
          python3 tools/package-ipa.py build/ipa-check/original/Payload/PloitSatellite.app build/ipa-check/repacked.ipa
          python3 tools/verify-ipa.py build/ipa-check/repacked.ipa
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/ipa-check/original.ipa') as original, zipfile.ZipFile('build/ipa-check/compat.ipa') as compat, zipfile.ZipFile('build/ipa-check/repacked.ipa') as repacked:
              assert set(original.namelist()) == set(compat.namelist()) == set(repacked.namelist())
              for name in original.namelist():
                  if name != 'Payload/PloitSatellite.app/Info.plist':
                      assert original.read(name) == compat.read(name) == repacked.read(name), name
              print('Device executable and resources match the tested release byte for byte')
          PY
